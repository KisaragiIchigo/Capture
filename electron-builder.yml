appId: dev.capture.app
productName: Capture
directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

asar: true

# 配布は手渡しで行うため、自動更新の配信先を持たない。
# 明示しないと electron-builder が配信情報を組み立てようとして、
# リポジトリ情報の無い状態では最後に失敗する。
publish: null

# キャプチャエンジン（OBS ポータブル）はインストーラへ同梱する。
# 初回起動時のダウンロードに頼ると、利用者の回線やセキュリティ対策ソフトの都合で
# 導入に失敗する。取得はビルドする側の 1 回だけにし、配布物には展開済みのものを載せる。
# 中身は `npm run engine:fetch` が build/engine/ へ用意する。
# asar の外へ実体として置く（OBS は自分のファイルを通常のファイルとして読む）。
extraResources:
  - from: build/engine
    to: engine
    filter:
      - '**/*'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
