<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      外部 CDN を一切許可しない。フォントは @fontsource でバンドルへ同梱している。
      connect-src の localhost は electron-vite の dev サーバと HMR のためのもので、
      パッケージ後は接続先が存在しないため実害はない。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
